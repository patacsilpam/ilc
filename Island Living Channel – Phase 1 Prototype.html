<style>
:root{--bg:#E8F1F1;--surf:#fff;--ink:#0C2A31;--mute:#56727A;--line:#D3E2E3;--brand:#0B5563;--tide:#1E9DA0;--hib:#D93A74;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061418;--surf:#0F2A31;--ink:#E6F3F3;--mute:#8FB0B4;--line:#1D4048;--brand:#5CC7C9;--tide:#3FB7BA;--hib:#FF6E9F;--on:#06232A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#061418;--surf:#0F2A31;--ink:#E6F3F3;--mute:#8FB0B4;--line:#1D4048;--brand:#5CC7C9;--tide:#3FB7BA;--hib:#FF6E9F;--on:#06232A;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
.mode{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:3px}
.mode button{border:0;background:none;padding:7px 18px;border-radius:99px;cursor:pointer;color:var(--mute)}
.mode button.on{background:var(--brand);color:var(--on)}
.note{font-size:12.5px;color:var(--mute);text-align:center;max-width:390px;margin:0}
.phone{position:relative;width:min(100%,390px);height:min(760px,calc(100dvh - 120px));min-height:520px;background:var(--surf);border:1px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(6,40,48,.18)}
.scr{flex:1;overflow-y:auto;padding:16px 16px 20px}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:23px;letter-spacing:-.3px}h2{font-size:17px;margin:20px 0 10px}h3{font-size:15px}
.mute{color:var(--mute);font-size:13px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surf)}
.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--mute);cursor:pointer;font-size:12.5px}
.tabs button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--hib)}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--on);padding:11px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.full{width:100%}.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hib);outline-offset:2px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mute)}
.hero{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#0B5563,#1E9DA0 60%,#F2A65A);min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;cursor:pointer}
.hero p{margin:0;font-size:13px;opacity:.92}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vid{cursor:pointer;background:none;border:0;padding:0;text-align:left}
.th{aspect-ratio:16/10;border-radius:12px;position:relative}
.th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-size:11px;padding:1px 6px;border-radius:6px}
.vid b{display:block;font-size:13.5px;margin-top:6px;line-height:1.25}
.promo{border:1.5px dashed var(--hib);border-radius:16px;padding:14px;margin:14px 0;background:color-mix(in srgb,var(--hib) 8%,transparent)}
.card{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(140deg,#0A3F4B,#0B5563 55%,#1E9DA0);display:flex;gap:14px;align-items:center}
.card .q{background:#fff;color:#0A3F4B;border-radius:10px;padding:6px;width:96px;height:96px;flex:none}
.card .q svg{width:100%;height:100%}
.gift{margin-top:12px;border-radius:16px;border:1px solid var(--line);padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;color:var(--hib)}
.live{background:#06232A;border-radius:16px;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;position:relative;background-image:linear-gradient(160deg,#06232A,#0B5563)}
.live span.b{position:absolute;left:10px;top:10px;background:var(--hib);padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
.play{width:54px;height:54px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:20px}
.stars button{background:none;border:0;font-size:28px;cursor:pointer;color:var(--line);padding:0 2px}.stars button.on{color:#F2A65A}
.banner{position:absolute;left:10px;right:10px;top:10px;background:var(--ink);color:var(--surf);border-radius:14px;padding:12px 14px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.banner b{display:block;font-size:13px}.banner span{font-size:13px;opacity:.9}
.sheet{position:absolute;inset:0;background:var(--surf);z-index:4;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.url{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--mute);word-break:break-all}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:var(--hib);width:0}
.admin{width:min(100%,780px);background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.stat{background:var(--bg);border-radius:12px;padding:12px;flex:1}.stat b{font-size:24px;display:block}
.hide{display:none!important}
@media (max-width:480px){.phone{border-radius:22px;height:calc(100dvh - 120px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{background:radial-gradient(900px 500px at 15% -10%,#0E3A44 0,transparent 60%),radial-gradient(700px 500px at 100% 100%,#2A2412 0,transparent 55%),#050F13}

.tabs{position:absolute;left:14px;right:14px;bottom:14px;z-index:3;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:rgba(14,36,44,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);padding:4px}
.tabs button{border-radius:22px;padding:11px 0;font-size:12px;letter-spacing:.2px}.tabs button.on{box-shadow:none;background:rgba(217,178,111,.14);color:var(--brand)}
.btn{border-radius:99px;padding:12px 20px;background:linear-gradient(180deg,#EBC888,#D1A55D);color:#1A1405;box-shadow:0 6px 18px rgba(217,178,111,.22)}
.btn.alt{background:transparent;color:var(--brand);border:1px solid rgba(217,178,111,.55);box-shadow:none;padding:8px 16px}

.hero h2{font-size:27px;line-height:1.1;margin:0}.hero .tag{background:rgba(0,0,0,.35);backdrop-filter:blur(8px);align-self:flex-start;padding:4px 11px;border-radius:99px;font-size:11.5px}

.vid b{font-weight:600;margin-top:9px}

.card{border-radius:24px;padding:22px;background:linear-gradient(135deg,#1C2B2E,#0A1518 58%,#3C3220);border:1px solid rgba(217,178,111,.5);box-shadow:0 22px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.card .q{border-radius:14px;background:#F4EFE3;color:#10252B}.card h3{font-family:Georgia,serif;font-weight:500}
.gift{border-radius:20px;background:rgba(255,255,255,.03)}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chip{border-radius:99px;padding:6px 15px}.chip.on{background:var(--brand);color:#1A1405;font-weight:600}
.row{border-bottom:1px solid var(--line);padding:14px 0}.tag{letter-spacing:.3px}
.live{border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.4)}.live span.b{background:#E5484D;color:#fff}.play{backdrop-filter:blur(8px);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5)}
.banner{top:48px;background:rgba(18,42,50,.92);color:var(--ink);border:1px solid rgba(217,178,111,.4);backdrop-filter:blur(14px);border-radius:20px}

.admin{border-radius:26px;background:rgba(10,29,36,.85);border:1px solid rgba(255,255,255,.1)}.stat{background:rgba(255,255,255,.04);border-radius:16px}.stat b{font-family:Georgia,serif;font-weight:500;color:var(--brand)}

function qr(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;let r="";const f=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);for(let y=0;y<21;y++)for(let x=0;x<21;x++){let on;if(f(x,y)){const a=x>13?x-14:x,b=y>13?y-14:y;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else{h=(h*1103515245+12345)>>>0;on=(h>>>16)&1}if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 23 23" fill="currentColor" aria-label="Sample QR code">${r}</svg>`}
const gr=(id,a,b)=>`<linearGradient id='${id}' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient>`;
const palm=(x,y,s,c)=>`<g fill='${c}' transform='translate(${x} ${y}) scale(${s})'><path d='M0 0Q3 -18 -2 -34L1 -34Q7 -18 3 0Z'/><path d='M-1 -34Q-14 -38 -22 -28Q-10 -34 -1 -31ZM0 -34Q12 -42 24 -32Q10 -36 1 -31ZM0 -34Q-6 -46 -16 -48Q-6 -44 -1 -33ZM1 -34Q8 -46 18 -46Q8 -42 2 -32Z'/></g>`;
const bg=(id,a,b,y,h)=>`<defs>${gr(id,a,b)}</defs><rect y='${y||0}' width='160' height='${h||100}' fill='url(#${id})'/>`;
const SC=[
()=>bg('s','#183d63','#f6a04d')+bg('w','#1e9da0','#0b4f5d',58,42)+`<circle cx='108' cy='54' r='15' fill='#ffe3a1'/><path d='M96 62h24M100 66h16M92 70h30' stroke='#ffe3a1' stroke-width='1.2' opacity='.6'/><path d='M0 100V86Q70 74 160 90V100Z' fill='#f1d9a8'/>`+palm(22,90,1.1,'#06240f')+palm(42,93,.8,'#0b3d1e'),
()=>bg('s','#3a2467','#ff9a62')+`<circle cx='130' cy='28' r='6' fill='#ffe9b8'/><path d='M40 100V58H54V44L66 30L78 44V58H92V100Z' fill='#241438'/><path d='M66 30V21M63 24H69' stroke='#241438' stroke-width='2'/><rect x='62' y='62' width='8' height='14' rx='4' fill='#ffc86b'/><rect x='46' y='66' width='4' height='8' rx='2' fill='#ffc86b'/><rect x='82' y='66' width='4' height='8' rx='2' fill='#ffc86b'/><path d='M0 100V88H160V100Z' fill='#150b24'/><g fill='#ffd27a'><circle cx='14' cy='80' r='2.2'/><circle cx='28' cy='82' r='2.2'/><circle cx='108' cy='82' r='2.2'/><circle cx='124' cy='80' r='2.2'/><circle cx='144' cy='82' r='2.2'/></g>`,
()=>bg('s','#4fb8ea','#dff4ff')+bg('w','#1b8fc0','#0a4d78',58,42)+`<circle cx='28' cy='20' r='9' fill='#fff3b0'/><ellipse cx='100' cy='18' rx='18' ry='5' fill='#fff' opacity='.8'/><path d='M100 58Q122 34 160 52V58Z' fill='#2f8f5b'/><path d='M0 58Q30 44 60 58Z' fill='#3aa56a' opacity='.8'/><path d='M34 68H92L84 78H42Z' fill='#fff'/><rect x='48' y='56' width='30' height='12' rx='2' fill='#f4f7f8'/><rect x='52' y='59' width='22' height='4' fill='#1b8fc0'/><rect x='60' y='50' width='12' height='6' fill='#e1251b'/><path d='M20 80H80M96 74H140M10 90H60' stroke='#fff' stroke-width='1' opacity='.4'/>`,
()=>bg('s','#7b2d8b','#ff8a5c')+`<circle cx='80' cy='62' r='22' fill='#ffd36e'/><path d='M0 100V74H16V62H28V74H38V54H50V74H64V68H78V60H88V74H100V66H114V76H130V62H142V74H160V100Z' fill='#3a1850'/>`+palm(18,100,1.2,'#1c0b2b')+palm(144,100,1,'#1c0b2b'),
()=>bg('s','#79d0f0','#eaf9ff')+bg('w','#25c9c4','#0a8c94',58,42)+`<circle cx='30' cy='22' r='11' fill='#fff1a8'/><path d='M70 60Q100 26 140 60Z' fill='#2e8b3a'/><path d='M110 60Q130 40 160 58V60Z' fill='#1f6d2c'/><path d='M0 100V82Q50 70 160 86V100Z' fill='#f5e3b5'/>`+palm(128,90,1,'#0b3d1e'),
()=>bg('s','#0f7ea0','#031c29')+`<g fill='#9be8ff' opacity='.12'><path d='M30 0H42L24 100H0Z'/><path d='M70 0H84L66 100H40Z'/><path d='M110 0H120L110 100H84Z'/></g><g fill='#ffb347'><ellipse cx='60' cy='40' rx='9' ry='5'/><path d='M69 40L77 35V45Z'/></g><g fill='#ff6f91'><ellipse cx='108' cy='28' rx='6' ry='3.5'/><path d='M114 28L120 24V32Z'/></g><g fill='#ffe066'><ellipse cx='36' cy='62' rx='5' ry='3'/><path d='M41 62L46 59V65Z'/></g><g fill='#e8575d'><circle cx='14' cy='94' r='9'/><circle cx='34' cy='97' r='8'/><circle cx='120' cy='95' r='10'/></g><g fill='#ffb347'><circle cx='70' cy='98' r='9'/><circle cx='150' cy='96' r='8'/></g><g fill='none' stroke='#fff' opacity='.4'><circle cx='80' cy='60' r='2'/><circle cx='84' cy='50' r='1.4'/><circle cx='78' cy='44' r='1'/></g>`
];
function th(i){return `background:#0B5563 url('data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 100' preserveAspectRatio='xMidYMid slice'>${SC[i%6]()}</svg>`).replace(/'/g,'%27')}') center/cover`}
function memberId(){return "ILC-"+(S.email||"guest").split("").reduce((h,c)=>(h*31+c.charCodeAt(0))%90000,10000)}
function push(title,msg){S.toast={title,msg};clearTimeout(S.tm);S.tm=setTimeout(()=>{S.toast=null;draw()},6000);draw()}
function go(t){S.tab=t;draw();$("#scr").scrollTop=0}
function draw(){
 $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg><span>${l}</span></button>`).join("");
 let h=({home,live,rewards,travel,more})[S.tab]();
 if(S.toast)h=`<div class="banner" onclick="S.toast=null;draw()"><b>Island Living Channel · now</b><span><strong>${S.toast.title}</strong> ${S.toast.msg}</span></div>`+h;
 if(S.register)h+=regSheet();
 if(S.player!==null)h+=playerSheet();
 const sc=$("#scr"),top=sc.scrollTop;sc.innerHTML=h;sc.scrollTop=top;drawAdmin()}
function home(){const v=S.vids[0];return `<img class="logo" src="${LOGO}" alt="Island Living Channel"><div class="stripe"></div><h1>${S.reg?"Welcome back, "+S.name.split(" ")[0]:"Stories from the islands"}</h1><p class="mute" style="margin:8px 0 20px">Travel and lifestyle films, live events and member rewards.</p>
<div class="hero" role="button" tabindex="0" onclick="play(0)" style="${th(0)}"><span class="tag" style="color:#fff">Featured</span><h2 style="margin:0">${v.t}</h2><p>${v.m} · tap to watch</p></div>
${S.reg?"":`<div class="promo"><h3>Join free, get a welcome gift</h3><p class="mute" style="margin:4px 0 10px">${S.gift.text}. Valid ${S.gift.days} days after you register.</p><button class="btn full" onclick="S.register=true;draw()">Create free account</button></div>`}
<h2>Catch up</h2><div class="grid">${S.vids.map((v,i)=>`<button class="vid" onclick="play(${i})"><div class="th" style="${th(i)}"><i>${v.m}</i></div><b>${v.t}</b></button>`).join("")}</div>`}
function live(){return `<h1>Live TV</h1><p class="mute" style="margin:4px 0 14px">Real-time events stream inside the app through YouTube Live.</p>
<div class="live" style="${th(3)}"><span class="b">LIVE</span><div class="play">▶</div></div>
<h2>Coming up</h2>${[["Today, 7:00 PM","MassKara street dance, live from Bacolod"],["Sat, 10:00 AM","Dinagyang preview with the festival team"],["Sun, 6:30 PM","Island Living Weekly: new episodes"]].map(r=>`<div class="row"><div><b>${r[1]}</b><div class="mute">${r[0]}</div></div><button class="btn alt" onclick="push('Reminder set','We’ll notify you before it starts.')">Remind me</button></div>`).join("")}`}
function rewards(){if(!S.reg)return `<h1>Rewards</h1><div class="promo" style="margin-top:16px"><h3>Your digital membership card lives here</h3><p class="mute" style="margin:4px 0 10px">Register free to get your card, a welcome gift, and 5% off at partner merchants.</p><button class="btn full" onclick="S.register=true;draw()">Create free account</button></div>${merch()}`;
 return `<h1>Rewards</h1><div class="card" style="margin-top:14px"><div class="q">${qr(S.email)}</div><div><img class="logo sm" src="${LOGO}" alt="Island Living Channel"><div style="opacity:.85;font-size:12px">Digital Member</div><h3 style="font-size:18px;margin:2px 0">${S.name}</h3><div style="font-size:13px;opacity:.9">${memberId()}</div></div></div>
<div class="gift"><div><span class="tag">Welcome gift</span><h3>${S.gift.text}</h3><div class="mute">Expires in ${S.gift.days} days</div></div><button class="btn" onclick="push('Gift ready','Show this at the counter: ${S.gift.text}.')">Use</button></div>${merch()}`}
function merch(){const l=M.filter(m=>S.city=="All"||m.c==S.city);return `<h2>Partner merchants · 5% off with your card</h2><div class="chips">${["All","Bacolod","Iloilo","Cebu"].map(c=>`<button class="chip ${S.city==c?"on":""}" onclick="S.city='${c}';draw()">${c}</button>`).join("")}</div>${l.map(m=>`<div class="row"><div><b>${m.n}</b><div class="mute">${m.t} · ${m.c}</div></div><button class="btn alt" onclick="${S.reg?`push('Show your card','5% off at ${m.n}.')`:"S.register=true;draw()"}">${S.reg?"Show card":"Join"}</button></div>`).join("")}`}
function travel(){const q=S.q;return `<h1>Travel</h1><p class="mute" style="margin:4px 0 10px">Book flights, ferries and stays through our partner Otamigo, without leaving the app.</p>
<div class="chips">${["Flights","Ferries","Stays"].map(t=>`<button class="chip ${q.type==t?"on":""}" onclick="S.q.type='${t}';S.searched=false;draw()">${t}</button>`).join("")}</div>
<label>${q.type=="Stays"?"Destination":"From"}</label><input value="${q.from}" oninput="S.q.from=this.value"><label>${q.type=="Stays"?"Check-in":"To"}</label><input value="${q.to}" oninput="S.q.to=this.value"><label>Date</label><input type="date" value="${q.date}" oninput="S.q.date=this.value">
<button class="btn full" onclick="S.searched=true;draw()">Search on Otamigo</button>
${S.searched?`<h2>Results</h2><div class="url">otamigo.com/search?type=${q.type.toLowerCase()}&amp;aff=ILC-SAMPLE</div>${[["Morning","₱1,890","7:10 – 8:05"],["Midday","₱2,240","12:30 – 13:25"],["Evening","₱1,740","18:45 – 19:40"]].map(r=>`<div class="row"><div><b>${q.type=="Stays"?"Option":"Departure"} · ${r[0]}</b><div class="mute">${r[2]}</div></div><div><b>${r[1]}</b></div></div>`).join("")}<p class="mute">Sample results. In the real app this is the Otamigo booking page; payment happens there and ILC’s affiliate ID is attached for commission tracking.</p>`:""}`}
function more(){return `<h1>More</h1><h2>Rate your experience</h2><label>What are you rating?</label><select id="fm"><option>The ILC app</option>${M.map(m=>`<option>${m.n}</option>`).join("")}</select>
<div class="stars" role="radiogroup" aria-label="Star rating">${[1,2,3,4,5].map(n=>`<button class="${S.rating>=n?"on":""}" aria-label="${n} stars" onclick="S.rating=${n};draw()">★</button>`).join("")}</div>
<textarea id="ft" rows="3" placeholder="Tell us what worked and what didn’t"></textarea><button class="btn full" onclick="sendFb()">Send feedback</button>
<h2>Demo tools</h2><label>Pretend you just arrived at</label><select onchange="S.hub=this.value">${Object.keys(HUBS).map(h=>`<option ${h==S.hub?"selected":""}>${h}</option>`).join("")}</select>
<button class="btn alt full" onclick="geo()">Simulate arrival (geo push)</button>
<p class="mute">Registration, merchant discounts, Otamigo booking, VOD, Live TV and feedback make up Phase 1. Loyalty tiers and ads come later.</p>`}
function geo(){const c=HUBS[S.hub];push("Welcome to "+c+"!",S.reg?"Show your ILC card for 5% off at partner merchants.":"Join free and claim your welcome gift.")}
function sendFb(){if(!S.rating){push("Pick a rating","Tap a star before sending.");return}S.fb.unshift({w:$("#fm").value,r:S.rating,t:$("#ft").value||"(no comment)"});S.rating=0;push("Thank you","Your feedback went to the ILC team.")}
function regSheet(){return `<div class="sheet"><h1>Create your free account</h1><p class="mute">You’ll get a digital membership card and a welcome gift right away.</p><label>Full name</label><input id="rn" placeholder="Juan dela Cruz"><label>Email</label><input id="re" type="email" placeholder="you@example.com"><button class="btn full" onclick="reg(false)">Create account</button><button class="btn alt full" onclick="reg(true)">Continue with Google</button><button class="chip" style="align-self:center;margin-top:8px" onclick="S.register=false;draw()">Not now</button></div>`}
function reg(g){const n=$("#rn").value.trim()||"Juan dela Cruz",e=$("#re").value.trim()||(g?"juan@gmail.com":"juan@example.com");S.name=n;S.email=e;S.reg=true;S.register=false;S.users++;S.tab="rewards";push("Welcome, "+n.split(" ")[0]+"!","Your gift: "+S.gift.text+".")}
function play(i){S.player=i;S.pp=0;S.playing=true;draw();clearInterval(S.pt);S.pt=setInterval(()=>{if(S.playing&&S.player!==null){S.pp=Math.min(100,S.pp+2);const b=$("#pb");if(b)b.style.width=S.pp+"%"}},300)}
function playerSheet(){const v=S.vids[S.player];return `<div class="sheet"><div class="live" style="${th(S.player)}"><div class="play" role="button" tabindex="0" onclick="S.playing=!S.playing;this.textContent=S.playing?'❚❚':'▶'">❚❚</div></div><div class="bar"><div id="pb" style="width:${S.pp||0}%"></div></div><h2 style="margin:0">${v.t}</h2><p class="mute">${v.m} · Sample video</p><button class="btn full" onclick="clearInterval(S.pt);S.player=null;draw()">Close</button></div>`}
function mode(m){$("#appv").classList.toggle("hide",m!="app");$("#adminv").classList.toggle("hide",m!="admin");$("#m-app").classList.toggle("on",m=="app");$("#m-admin").classList.toggle("on",m=="admin");drawAdmin()}
function drawAdmin(){const a=$("#adminv");if(a.classList.contains("hide"))return;const keep=a.contains(document.activeElement)&&document.activeElement.id;a.innerHTML=`<img class="logo" src="${LOGO}" alt="Island Living Channel"><div class="stripe"></div><h1>Web CMS</h1><p class="mute">Editorial dashboard. Changes show up in the mobile app straight away.</p>
<div style="display:flex;gap:12px;margin:16px 0"><div class="stat"><b>${S.users.toLocaleString()}</b>Registered users</div><div class="stat"><b>${S.fb.length}</b>Feedback submissions</div><div class="stat"><b>${S.vids.length}</b>Videos live</div></div>
<div class="cols"><div><h2>Welcome gift</h2><label>Gift offer</label><input id="ag" value="${S.gift.text}"><label>Expires after</label><select id="ad">${[3,7,14,30].map(d=>`<option value="${d}" ${d==S.gift.days?"selected":""}>${d} days</option>`).join("")}</select><button class="btn" onclick="S.gift={text:$('#ag').value||'Welcome gift',days:+$('#ad').value};draw();$('#adminv .btn').textContent='Saved. App updated.'">Save gift</button>
<h2>Announcement push</h2><label>Message to all app users</label><input id="an" placeholder="New episode of Island Living Weekly is out"><button class="btn" onclick="const v=$('#an').value;if(v){push('Announcement',v);$('#an').value=''}">Send push notification</button></div>
<div><h2>Video library</h2><label>Video title</label><input id="vt" placeholder="Episode title"><label>MP4 file</label><input type="file" accept="video/mp4"><button class="btn" onclick="const t=$('#vt').value.trim();if(t){S.vids.unshift({t,m:'5:00'});draw()}">Upload to library</button>
<p class="mute">Uploads are simulated here; the real CMS sends the MP4 to cloud storage.</p><h2>Latest feedback</h2>${S.fb.length?S.fb.slice(0,4).map(f=>`<div class="row"><div><b>${f.w}</b><div class="mute">${f.t}</div></div><span class="tag">${"★".repeat(f.r)}</span></div>`).join(""):`<p class="mute">No feedback yet. Submit one from the app’s More tab.</p>`}</div></div>`;if(keep){const e=document.getElementById(keep);if(e)e.focus()}}
const IC={home:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/>',live:'<circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 000 8.4M16.2 7.8a6 6 0 010 8.4M4.9 4.9a10 10 0 000 14.2M19.1 4.9a10 10 0 010 14.2"/>',rewards:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8C9.5 8 8 7 8 5.5S9.5 3 12 8zM12 8c2.5 0 4-1 4-2.5S14.5 3 12 8z"/>',travel:'<path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13L21 3"/>',more:'<path d="M4 7h16M4 12h16M4 17h16"/>'};
function theme(t){document.documentElement.dataset.theme=t;const b=$("#tg");if(b)b.textContent=t=="light"?"☾ Dark":"☀ Light"}
theme(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
draw();
</script></body></html>
